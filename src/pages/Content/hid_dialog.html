<div class="teams-telephony-hid-dialog">
    <div class="header">
        <h2>Teams HID Telephony Devices</h2>
        <button id="btnTeamsTelephonyDialogClose" class="button-close">
            <i class="google-material-icons">x</i>
        </button>
    </div>
    <div class="content">
        <div class="text">
            Connected devices:
            <div id="radioTelephonyConnectedDevices">
                No devices found
            </div>
        </div>
        <div class="text">
            Supported: Jabra, HP/Poly, EPOS/Sennheiser, Yealink, VBeT and CyberAcoustics headsets.
            Teams needs microphone access to list them. To connect, select a device, click Connect and select the headset in Chrome.
        </div>
        <div class="text" id="teamsTelephonyStatus"></div>
        <button id="btnTelephonyDialogHIDRequest" class="button">
            <span>Connect</span>
        </button>
    </div>
</div>
